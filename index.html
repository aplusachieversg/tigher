<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APLUS PSLE SmartMatch</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.hero{background:linear-gradient(135deg,#111b3b,#4938a8);color:white;border-radius:24px;padding:34px;box-shadow:0 18px 45px #18203b22}.brand{font-size:12px;font-weight:800;letter-spacing:.12em;opacity:.8}h1{font-size:42px;margin:10px 0 3px}.sub{font-size:19px;opacity:.86}.tag{font-weight:800;margin-top:14px}.form{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:25px}.f label{display:block;font-size:11px;font-weight:800;margin-bottom:6px;opacity:.8}.f input,.f select{width:100%;padding:12px;border:0;border-radius:10px;font-size:14px}.wide{grid-column:span 2}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer}.go{background:white;color:#30248e}.clear{background:#ffffff22;color:white;border:1px solid #ffffff44}.actions{margin-top:15px;display:flex;gap:9px}.note{margin-top:16px;background:#fff8db;color:#674f00;padding:11px 13px;border-radius:10px;font-size:12px}.status{margin-top:10px;background:#ffffff18;padding:10px;border-radius:10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:20px 0}.stat,.card,.choices{background:white;border:1px solid #e5e8ef;border-radius:16px;padding:16px}.stat b{font-size:21px;display:block}.muted{color:#667085;font-size:12px}.band{margin:20px 0}.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.bh h2{font-size:18px;margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eeeaff;color:#4938a8;font-size:11px;font-weight:800}.card h3{font-size:16px;margin:9px 0 6px}.meta{font-size:13px;line-height:1.6;color:#667085}.cop{font-weight:800;color:#172033}.loc{margin-top:11px;padding-top:10px;border-top:1px solid #edf0f4;color:#4938a8;font-weight:800;font-size:13px;cursor:pointer}.details{display:none;background:#f7f8fb;border-radius:10px;padding:10px;margin-top:8px;font-size:12px;line-height:1.7}.add{margin-top:10px}.choices{margin-top:25px}.choices h2{margin:0 0 10px}.choice{padding:9px 0;border-bottom:1px solid #edf0f4}.empty{padding:20px;text-align:center;color:#667085;background:#fafbfc;border:1px dashed #d5d9e2;border-radius:10px}.autocomplete{position:relative}.suggestions{position:absolute;z-index:20;left:0;right:0;top:70px;background:white;border-radius:10px;box-shadow:0 12px 30px #11182725;overflow:hidden;color:#172033}.suggestion{padding:11px 13px;border-bottom:1px solid #edf0f4;cursor:pointer}.suggestion:hover{background:#f4f1ff}.selected-school{margin-top:7px;font-size:11px;font-weight:700;color:#e8e4ff}@media(max-width:850px){.form{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){h1{font-size:30px}.form,.cards,.stats{grid-template-columns:1fr}.wide{grid-column:span 1}}
.modulebar{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;padding:10px 14px;background:#fff;border:1px solid #e5e8ef;border-radius:12px;color:#4938a8;font-size:12px;font-weight:800;letter-spacing:.08em}.modulebar span:last-child{color:#667085;font-weight:600;letter-spacing:0}.printbar{display:flex;justify-content:flex-end;margin-top:12px}.print-report{display:none}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.modulebar,.hero,#results,.choices{display:none!important}.print-report{display:block!important}.print-report h1{font-size:28px;margin:0 0 4px}.print-report .print-brand{font-size:11px;font-weight:800;letter-spacing:.12em}.print-report .print-sub{font-size:14px;color:#667085;margin-bottom:18px}.print-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}.print-summary div{border:1px solid #ddd;border-radius:8px;padding:8px}.print-summary b{display:block;font-size:12px}.print-summary span{font-size:10px;color:#667085}.print-table{width:100%;border-collapse:collapse;font-size:10px}.print-table th,.print-table td{border:1px solid #d8dce4;padding:7px;text-align:left;vertical-align:top}.print-table th{font-weight:800}.print-band{font-weight:800}.print-note{margin-top:16px;font-size:9px;color:#667085;line-height:1.5}.print-label{font-weight:800}.print-page{page-break-inside:avoid}}
</head>
<body><main class="wrap">
<div class="modulebar"><span>选校匹配模块 / MATCHING MODULE</span><span>APLUS PSLE SmartMatch Engine</span></div><section class="hero">
<div class="brand">APLUS ACHIEVER</div><h1>APLUS PSLE SmartMatch</h1><div class="sub">PSLE 中学选校匹配引擎 / Secondary School Selection Engine</div><div class="tag">广泛匹配 · 智能筛选 · 家长自主选择 / Match broadly · Filter intelligently · Choose personally</div>
<div class="form">
<div class="f"><label>PSLE 分数 / PSLE SCORE</label><input id="score" type="number" min="4" max="32" value="7"></div>
<div class="f"><label>高级母语 / HMTL</label><select id="hmtl"><option value="">No 高级母语 / HMTL</option><option>Distinction</option><option>Merit</option><option>Pass</option></select></div>
<div class="f"><label>性别 / GENDER</label><select id="gender"><option value="BOY">男生 / Boy</option><option value="GIRL">女生 / Girl</option></select></div>
<div class="f"><label>地区 / 规划区 · TOWN / PLANNING AREA</label><select id="town"><option value="">Loading…</option></select></div>
<div class="f autocomplete"><label>小学 / PRIMARY SCHOOL</label><input id="primary" autocomplete="off" placeholder="Type e.g. wood"><div id="suggestions" class="suggestions" style="display:none"></div><div id="selectedSchool" class="selected-school"></div></div>
</div>
<div id="al" class="form" style="display:none"><div class="f"><label>英语 AL / ENGLISH AL</label><select id="eng"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div><div class="f"><label>数学 AL / MATHEMATICS AL</label><select id="math"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div></div>
<div class="actions"><button class="btn go" id="runBtn">寻找匹配中学 / Find Matching Schools</button><button class="btn clear" id="clearBtn">清除我的6所学校 / Clear My 6</button></div>
<div id="status" class="status">Connecting to APLUS SmartMatch database…</div>
<div class="note"><b>DATABASE BUILD</b> — This page now uses Supabase RPCs for Primary School search, 规划区 / Planning Areas, matching, affiliation, COP, programme type and school location. No demo school list is used.</div>
</section>
<div id="results"></div>
<section class="choices"><h2>我的6所学校选择 / My 6 School Choices</h2><div id="choices" class="empty">Select up to 6 schools. SmartMatch does not decide the family's final six.</div><div class="printbar"><button class="btn go" id="printBtn">🖨️ 打印我的6所学校 / Print My 6 Choices</button></div></section><section id="printReport" class="print-report"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://mktszwqyklmrxzynzmtv.supabase.co';
const SUPABASE_KEY='sb_publishable_b2XJwxjy8jzh6WfrepA5tQ__y9Xab2u';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{global:{headers:{'x-client-info':'aplus-smartmatch-web'}}});
let primaryId=null,primaryName='',selected=[],lastRows=[],lastScore=null,lastTown='';
const bands=['REACH FAR','REACH','TARGET','SAFER','SAFER FAR','UNLIKELY'];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const status=t=>document.getElementById('status').textContent=t;
async function bootstrapDatabase(){
 try{
   status('Checking APLUS master database and starting official MOE sync if needed…');
   const {data,error}=await db.functions.invoke('bootstrap-moe-data',{body:{source:'smartmatch-page'}});
   if(error){console.warn('Bootstrap:',error);status('Database connection ready; master data sync may still be running.');return false}
   if(data?.sync?.cop_failures) console.warn('MOE sync failures:',data.sync.cop_failures);
   return true;
 }catch(e){console.warn('Bootstrap:',e);status('Database connection ready; master data sync may still be running.');return false}
}
async function loadTowns(){
 const {data,error}=await db.rpc('sm_public_planning_areas');
 if(error){status('Database connected, but 规划区 / Planning Areas are not loaded yet.');return}
 const el=document.getElementById('town');el.innerHTML='<option value="">选择地区 / 规划区 · Select Town / 规划区 / Planning Area</option>';
 (data||[]).forEach(x=>el.insertAdjacentHTML('beforeend','<option>'+esc(x.planning_area_name)+'</option>'));
 status('APLUS database connection ready.');
}
let timer;
document.getElementById('primary').addEventListener('input',e=>{
 clearTimeout(timer);primaryId=null;primaryName='';document.getElementById('selectedSchool').textContent='';
 const q=e.target.value.trim();if(q.length<2){document.getElementById('suggestions').style.display='none';return}
 timer=setTimeout(()=>searchPrimary(q),220);
});
async function searchPrimary(q){
 const {data,error}=await db.rpc('sm_public_primary_search',{p_query:q,p_limit:12});
 const box=document.getElementById('suggestions');
 if(error){box.innerHTML='<div class="suggestion">Database search error</div>';box.style.display='block';return}
 if(!data?.length){box.innerHTML='<div class="suggestion">No primary school found</div>';box.style.display='block';return}
 box.innerHTML=data.map(x=>'<div class="suggestion" data-id="'+x.primary_school_id+'" data-name="'+esc(x.school_name)+'"><b>'+esc(x.school_name)+'</b><br><span class="muted">'+esc(x.planning_area||'')+' · '+esc(x.address||'')+'</span></div>').join('');
 box.style.display='block';
 box.querySelectorAll('.suggestion[data-id]').forEach(el=>el.onclick=()=>{
   primaryId=el.dataset.id;primaryName=el.dataset.name;document.getElementById('primary').value=primaryName;
   document.getElementById('selectedSchool').textContent='✓ Selected: '+primaryName;
   box.style.display='none';
 });
}
document.addEventListener('click',e=>{if(!e.target.closest('.autocomplete'))document.getElementById('suggestions').style.display='none'});
document.getElementById('score').addEventListener('input',()=>{
 const s=+document.getElementById('score').value;document.getElementById('al').style.display=s>=26&&s<=30?'grid':'none';
});
document.getElementById('clearBtn').onclick=()=>{selected=[];if(lastRows.length)renderResults(lastRows,lastScore,lastTown);else renderChoices()};
document.getElementById('runBtn').onclick=runMatch;
document.getElementById('printBtn').onclick=printMy6;
async function runMatch(){
 const score=+document.getElementById('score').value;
 const town=document.getElementById('town').value;
 const gender=document.getElementById('gender').value;
 if(score<4||score>32){alert('PSLE Score must be between 4 and 32.');return}
 if(!primaryId){alert('Please search and select the Primary School first.');return}
 if(!town){alert('Please select a Town / 规划区 / Planning Area.');return}
 if(score>=26&&score<=30){
   if(!document.getElementById('eng').value||!document.getElementById('math').value){alert('English AL and Mathematics AL are required for PSLE scores 26–30.');return}
 }
 status('Running SmartMatch from APLUS database…');
 const args={
   p_psle_score:score,
   p_hmtl_grade:document.getElementById('hmtl').value||null,
   p_gender:gender,
   p_primary_school_id:primaryId,
   p_english_al:score>=26&&score<=30?+document.getElementById('eng').value:null,
   p_mathematics_al:score>=26&&score<=30?+document.getElementById('math').value:null,
   p_as_of_year:new Date().getFullYear(),
   p_limit_per_band:10
 };
 const {data,error}=await db.rpc('aplus_psle_smartmatch_engine_v3',args);
 if(error){status('SmartMatch error: '+error.message);document.getElementById('results').innerHTML='<div class="empty" style="margin-top:20px">No results returned. Check the database sync status.</div>';return}
 status('SmartMatch completed. Results are from the APLUS database.');
 const enriched=await Promise.all((data||[]).map(async x=>{const {data:years}=await db.rpc('sm_public_cop_years',{p_school_id:x.school_id,p_programme_type:x.programme_type,p_affiliation_status:x.affiliation_status,p_as_of_year:new Date().getFullYear()});return {...x,cop_years:years||[]}}));
 renderResults(enriched,score,town);
}
function renderResults(rows,score,town){
  lastRows=rows||[];lastScore=score;lastTown=town;
 const pool=rows.filter(x=>x.match_band!=='UNLIKELY').length;
 let h='<div class="stats"><div class="stat"><b>'+score+'</b><span class="muted">PSLE 分数 / PSLE Score</span></div><div class="stat"><b>'+esc(town)+'</b><span class="muted">地区参考 / Location Reference</span></div><div class="stat"><b>'+pool+'</b><span class="muted">广泛匹配池 / Broad Match Pool</span></div><div class="stat"><b>'+selected.length+'/6</b><span class="muted">我的选择 / My Choices</span></div></div><p class="muted"><b>PSLE Score + COP = core matching.</b> 规划区 / Planning Area is a comparison reference and does not change the Match Band.</p>';
 bands.forEach(b=>{
   const a=rows.filter(x=>x.match_band===b);
   h+='<section class="band"><div class="bh"><h2>'+b+'</h2><span class="muted">'+a.length+' schools</span></div>';
   if(!a.length){h+='<div class="empty">No schools in this band from the current database snapshot.</div></section>';return}
   h+='<div class="cards">';
   a.forEach(x=>{
     const key=x.school_id+'|'+x.programme_type;
     const sel=selected.includes(key);
     h+='<article class="card"><span class="badge">'+esc(x.match_band)+'</span><h3>'+esc(x.school_name)+'</h3>'+
     '<div class="meta"><span class="cop">参考分数 / Reference COP '+esc(x.latest_cop)+'</span> · 分数差距 / Gap '+(x.cop_gap>0?'+':'')+esc(x.cop_gap)+' · '+(x.programme_type==='IP'?'IP 课程 / IP Programme':(x.posting_group||'不适用 / Not applicable'))+'</div>'+
     '<div class="meta">'+esc(x.programme_type)+' · '+esc(x.affiliation_status)+(x.ip?' · IP 学校 / IP school':'')+'</div>'+
     '<div class="meta">'+((x.cop_years||[]).map(y=>esc(y.year)+' COP: '+esc(y.cop)).join(' · ')||'COP 数据暂缺 / COP data unavailable')+'</div>'+
     '<div class="loc" onclick="toggle(this)">📍 '+esc(x.planning_area||'地点资料暂缺 / Location not available')+(x.planning_area===town?' · 同一规划区 / Same planning area':'')+'</div>'+
     '<div class="details"><b>学校地址 / School Address</b><br>'+esc(x.address||'地点资料暂缺 / Location not available')+'<br><b>邮编 / Postal Code</b>: '+esc(x.postal_code||'地点资料暂缺 / Location not available')+'<br><b>规划区 / Planning Area</b>: '+esc(x.planning_area||'地点资料暂缺 / Location not available')+'<br><b>区域 / Zone</b>: '+esc(x.zone||'地点资料暂缺 / Location not available')+'</div>'+
     '<button class="btn '+(sel?'clear':'go')+' add" onclick="choose(\''+key+'\')">'+(sel?'从我的6所学校移除 / Remove from My 6':'加入我的6所学校 / Add to My 6')+'</button></article>';
   });
   h+='</div></section>';
 });
 document.getElementById('results').innerHTML=h;renderChoices();
}
function toggle(e){const d=e.nextElementSibling;d.style.display=d.style.display==='block'?'none':'block'}
function choose(key){
  if(selected.includes(key)) selected=selected.filter(x=>x!==key);
  else { if(selected.length>=6){alert('You can select up to 6 schools.');return} selected.push(key); }
  renderResults(lastRows,lastScore,lastTown);
}
function bandLabel(b){
 const m={'REACH FAR':'冲高一点 / REACH FAR','REACH':'冲一下 / REACH','TARGET':'目标 / TARGET','SAFER':'稳妥 / SAFER','SAFER FAR':'更稳妥 / SAFER FAR','UNLIKELY':'匹配度较低 / UNLIKELY'};
 return m[b]||b;
}
function renderChoices(){const e=document.getElementById('choices');e.className=selected.length?'':'empty';e.innerHTML=selected.length?selected.map((x,i)=>{const parts=x.split('|');const schoolId=parts[0];const programmeType=parts[1];const row=lastRows.find(r=>r.school_id===schoolId&&r.programme_type===programmeType);const name=row?.school_name||schoolId;return '<div class="choice"><b>'+(i+1)+'.</b> '+esc(name)+(row?' · '+esc(bandLabel(row.match_band)):'')+'</div>'}).join(''):'Select up to 6 schools. SmartMatch does not decide the family\'s final six.';renderPrintReport()}
function printMy6(){
 if(!selected.length){alert('Please select at least one school in My 6 first.');return}
 renderPrintReport();
 window.print();
}
function renderPrintReport(){
 const box=document.getElementById('printReport');
 const rows=selected.map(x=>{const parts=x.split('|');return lastRows.find(r=>r.school_id===parts[0]&&r.programme_type===parts[1])}).filter(Boolean);
 if(!rows.length){box.innerHTML='';return}
 const hmtl=document.getElementById('hmtl').value||'None / 无';
 const gender=document.getElementById('gender').value==='GIRL'?'女生 / Girl':'男生 / Boy';
 const town=document.getElementById('town').value||lastTown||'—';
 box.innerHTML='<div class="print-brand">APLUS ACHIEVER</div><h1>APLUS PSLE SmartMatch</h1><div class="print-sub">PSLE 中学选校匹配报告 / Secondary School Selection Report</div>'+
 '<div class="print-summary"><div><b>PSLE Score / PSLE 分数</b><span>'+esc(lastScore??document.getElementById('score').value)+'</span></div><div><b>Primary School / 小学</b><span>'+esc(primaryName||'—')+'</span></div><div><b>HMTL / 高级母语</b><span>'+esc(hmtl)+'</span></div><div><b>Gender / 性别</b><span>'+esc(gender)+'</span></div><div><b>Planning Area / 规划区</b><span>'+esc(town)+'</span></div><div><b>Choices / 学校选择</b><span>'+rows.length+' / 6</span></div></div>'+
 '<table class="print-table"><thead><tr><th>#</th><th>School / 学校</th><th>Programme / 课程</th><th>Affiliation / 附属</th><th>Reference COP</th><th>Gap / 差距</th><th>SmartMatch</th><th>2024–2025 COP</th><th>Address / 地址</th></tr></thead><tbody>'+
 rows.map((r,i)=>'<tr class="print-page"><td><b>'+(i+1)+'</b></td><td><b>'+esc(r.school_name)+'</b></td><td>'+esc(r.programme_type==='IP'?'IP Programme / IP 课程':(r.posting_group||'Not applicable / 不适用'))+'</td><td>'+esc(r.affiliation_status)+'</td><td>'+esc(r.latest_cop)+'</td><td>'+(r.cop_gap>0?'+':'')+esc(r.cop_gap)+'</td><td class="print-band"><b>'+esc(bandLabel(r.match_band))+'</b></td><td>'+esc((r.cop_years||[]).map(y=>y.year+': '+y.cop).join(' · ')||'Unavailable / 暂缺')+'</td><td>'+esc(r.address||'Location not available / 地点资料暂缺')+'<br>'+esc(r.planning_area||'')+' '+esc(r.postal_code||'')+'</td></tr>').join('')+
 '</tbody></table><div class="print-note">SmartMatch labels are data-based matching bands. SmartMatch does not decide the family’s final six choices. COP data shown is from the current APLUS database snapshot.</div>';
}
(async()=>{ await bootstrapDatabase(); await loadTowns(); })();
</script>
</body></html>
