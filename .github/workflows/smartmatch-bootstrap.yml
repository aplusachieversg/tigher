name: SmartMatch Master Data Import

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smartmatch-bootstrap.yml"

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import all APLUS SmartMatch master data
        run: |
          echo "Starting APLUS SmartMatch master import"
          curl --fail-with-body --retry 5 --retry-delay 10 \
            -X POST \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://mktszwqyklmrxzynzmtv.supabase.co/functions/v1/sync-moe-school-directory"
