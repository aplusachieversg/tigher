name: SmartMatch Master Data Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smartmatch-bootstrap.yml"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APLUS database bootstrap
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X GET \
            -H "Accept: application/json" \
            "https://mktszwqyklmrxzynzmtv.supabase.co/functions/v1/bootstrap-moe-data"
